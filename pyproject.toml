[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rlx"
version = "0.1.0"
description = "Reinforcement Learning, Deep RL and MARL algorithms implemented from scratch, with a live web dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dashboard = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["rlx[dashboard]", "pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
rlx-dashboard = "rlx.dashboard.server:main"

[tool.setuptools.packages.find]
include = ["rlx*"]

[tool.setuptools.package-data]
"rlx.dashboard" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
